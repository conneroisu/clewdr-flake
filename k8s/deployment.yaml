# ClewdR Kubernetes Deployment Configuration
# Provides production-ready deployment with security hardening and high availability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clewdr
  namespace: default
  labels:
    app: clewdr
    version: v1
spec:
  # Run 3 replicas for high availability and load distribution
  replicas: 3
  selector:
    matchLabels:
      app: clewdr
  template:
    metadata:
      labels:
        app: clewdr
        version: v1
    spec:
      containers:
      - name: clewdr
        image: clewdr:latest
        ports:
        - containerPort: 8484
          name: http
          protocol: TCP
        env:
        # Application logging configuration
        - name: RUST_LOG
          value: "info"
        # LLM API credentials loaded securely from Kubernetes secrets
        # Prevents API keys from being exposed in deployment manifests
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: clewdr-secrets
              key: anthropic-api-key
        - name: GOOGLE_AI_API_KEY
          valueFrom:
            secretKeyRef:
              name: clewdr-secrets
              key: google-ai-api-key
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Security hardening following defense-in-depth principles
        securityContext:
          allowPrivilegeEscalation: false  # Prevent privilege escalation attacks
          runAsNonRoot: true               # Enforce non-root execution
          runAsUser: 65534                 # Run as 'nobody' user
          runAsGroup: 65534                # Run as 'nobody' group
          capabilities:
            drop:
            - ALL                          # Drop all Linux capabilities
          readOnlyRootFilesystem: true     # Prevent filesystem modifications
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: clewdr-service
  namespace: default
  labels:
    app: clewdr
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8484
    protocol: TCP
    name: http
  selector:
    app: clewdr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clewdr-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - clewdr.example.com
    secretName: clewdr-tls
  rules:
  - host: clewdr.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clewdr-service
            port:
              number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: clewdr-secrets
  namespace: default
type: Opaque
data:
  # Base64 encoded API keys (replace with actual values)
  anthropic-api-key: eW91cl9hbnRocm9waWNfYXBpX2tleV9oZXJl  # your_anthropic_api_key_here
  google-ai-api-key: eW91cl9nb29nbGVfYWlfYXBpX2tleV9oZXJl     # your_google_ai_api_key_here
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clewdr-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clewdr
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clewdr-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clewdr
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80