name: Auto-update ClewdR Version

on:
  schedule:
    # Check for updates daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      force_update:
        description: 'Force update even if no new version detected'
        required: false
        default: false
        type: boolean

env:
  UPSTREAM_REPO: 'waylaidwanderer/clewdr'
  
jobs:
  check-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        
    - name: Setup Cachix
      uses: cachix/cachix-action@v15
      with:
        name: clewdr-flake
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        
    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(grep -E '^  version = ' package.nix | sed 's/.*"\(.*\)".*/\1/')
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
        
    - name: Get latest upstream release
      id: latest_release
      run: |
        LATEST_TAG=$(curl -s "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name')
        LATEST_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
        echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest upstream version: $LATEST_VERSION (tag: $LATEST_TAG)"
        
    - name: Compare versions
      id: version_check
      run: |
        CURRENT="${{ steps.current_version.outputs.current_version }}"
        LATEST="${{ steps.latest_release.outputs.latest_version }}"
        FORCE="${{ github.event.inputs.force_update }}"
        
        echo "Comparing: $CURRENT vs $LATEST"
        
        if [ "$CURRENT" != "$LATEST" ] || [ "$FORCE" = "true" ]; then
          echo "update_needed=true" >> $GITHUB_OUTPUT
          echo "Update needed: current=$CURRENT, latest=$LATEST, force=$FORCE"
        else
          echo "update_needed=false" >> $GITHUB_OUTPUT
          echo "No update needed: versions match"
        fi
        
    - name: Download and extract latest source
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        LATEST_TAG="${{ steps.latest_release.outputs.latest_tag }}"
        LATEST_VERSION="${{ steps.latest_release.outputs.latest_version }}"
        
        echo "Downloading $LATEST_TAG source..."
        
        # Download the latest release source
        curl -L "https://github.com/$UPSTREAM_REPO/archive/refs/tags/$LATEST_TAG.tar.gz" -o "clewdr-$LATEST_VERSION.tar.gz"
        
        # Extract and replace upstream source
        tar -xzf "clewdr-$LATEST_VERSION.tar.gz"
        rm -rf upstream-source/clewdr-source
        mv "clewdr-$LATEST_TAG" upstream-source/clewdr-source
        
        # Clean up
        rm "clewdr-$LATEST_VERSION.tar.gz"
        
    - name: Apply patches and migrate to reqwest
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        cd upstream-source/clewdr-source
        
        echo "Applying HTTP client migration patches..."
        
        # Copy our patched Cargo.toml and Cargo.lock
        cp ../../build-artifacts/cargo-patch.toml Cargo.toml
        cp ../../build-artifacts/cargo-patch.lock Cargo.lock
        
        # Apply source code patches if they exist
        if [ -f "../../source-patches/wreq-to-reqwest.patch" ]; then
          echo "Applying source code patches..."
          git init .
          git add .
          git commit -m "Initial commit"
          git apply ../../source-patches/wreq-to-reqwest.patch || echo "Patch already applied or not needed"
        fi
        
    - name: Update package.nix version
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        LATEST_VERSION="${{ steps.latest_release.outputs.latest_version }}"
        
        # Update version in package.nix
        sed -i "s/version = \".*\";/version = \"$LATEST_VERSION\";/" package.nix
        
        echo "Updated package.nix to version $LATEST_VERSION"
        
    - name: Test build with new version
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        echo "Testing build with new version..."
        
        # Test that the package builds successfully
        nix build .#clewdr --no-link --print-build-logs
        
        # Test flake check passes
        nix flake check --no-build
        
        echo "Build tests passed!"
        
    - name: Update Cargo hash if needed
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        echo "Updating Cargo hash..."
        
        # Try to build and capture the expected hash from error
        BUILD_OUTPUT=$(nix build .#clewdr --no-link 2>&1 || true)
        
        if echo "$BUILD_OUTPUT" | grep -q "got:.*sha256"; then
          NEW_HASH=$(echo "$BUILD_OUTPUT" | grep "got:" | sed -n 's/.*got:[ ]*\(sha256-[A-Za-z0-9+/=]*\).*/\1/p' | head -1)
          if [ -n "$NEW_HASH" ]; then
            echo "Updating cargoHash to: $NEW_HASH"
            sed -i "s/cargoHash = \".*\";/cargoHash = \"$NEW_HASH\";/" package.nix
            
            # Test build again with correct hash
            nix build .#clewdr --no-link
          fi
        fi
        
    - name: Run comprehensive tests
      if: steps.version_check.outputs.update_needed == 'true'
      run: |
        echo "Running comprehensive tests..."
        
        # Test main package build
        nix build .#clewdr --no-link
        
        # Test containers build
        nix build .#container --no-link
        
        # Test that basic checks pass
        nix build .#checks.x86_64-linux.build --no-link
        nix build .#checks.x86_64-linux.container-build --no-link
        nix build .#checks.x86_64-linux.security-audit --no-link
        
        echo "All tests passed!"
        
    - name: Create Pull Request
      if: steps.version_check.outputs.update_needed == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: |
          chore: Update ClewdR to version ${{ steps.latest_release.outputs.latest_version }}
          
          - Updated upstream source from ${{ steps.current_version.outputs.current_version }} to ${{ steps.latest_release.outputs.latest_version }}
          - Applied HTTP client migration patches (wreq -> reqwest)
          - Updated package.nix version and cargoHash
          - Verified all builds and tests pass
          
          Source: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.latest_release.outputs.latest_tag }}
          
          🤖 This update was automatically generated by the autoupdate workflow.
        title: "chore: Update ClewdR to ${{ steps.latest_release.outputs.latest_version }}"
        body: |
          ## 🚀 ClewdR Version Update
          
          This PR updates ClewdR from version **${{ steps.current_version.outputs.current_version }}** to **${{ steps.latest_release.outputs.latest_version }}**.
          
          ### 📋 Changes Made
          - ✅ Downloaded latest source from upstream release
          - ✅ Applied HTTP client migration patches (wreq → reqwest)
          - ✅ Updated `package.nix` version to `${{ steps.latest_release.outputs.latest_version }}`
          - ✅ Updated Cargo dependencies hash
          - ✅ Verified all builds pass successfully
          - ✅ Tested package, containers, and core checks
          
          ### 🔗 Upstream Release
          - **Repository**: https://github.com/${{ env.UPSTREAM_REPO }}
          - **Release**: https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.latest_release.outputs.latest_tag }}
          - **Tag**: `${{ steps.latest_release.outputs.latest_tag }}`
          
          ### 🧪 Testing Status
          The following components were tested successfully:
          - 📦 Main ClewdR package build
          - 🐳 Container image builds (layered & OCI)
          - 🔒 Security audit checks
          - 🔧 Development environment
          
          ### 🔄 Next Steps
          1. Review the changes in this PR
          2. Test any specific functionality if needed
          3. Merge when ready to deploy the update
          
          ---
          🤖 **Auto-generated** by the ClewdR autoupdate workflow
        branch: autoupdate/clewdr-${{ steps.latest_release.outputs.latest_version }}
        delete-branch: true
        labels: |
          autoupdate
          dependencies
          clewdr
        assignees: |
          ${{ github.repository_owner }}
        
    - name: Summary
      if: always()
      run: |
        echo "=== Auto-update Summary ==="
        echo "Current version: ${{ steps.current_version.outputs.current_version }}"
        echo "Latest version: ${{ steps.latest_release.outputs.latest_version }}"
        echo "Update needed: ${{ steps.version_check.outputs.update_needed }}"
        
        if [ "${{ steps.version_check.outputs.update_needed }}" = "true" ]; then
          echo "✅ Update process completed - PR created"
        else
          echo "ℹ️  No update needed - already on latest version"
        fi