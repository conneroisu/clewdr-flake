        ### Production
        
        ```bash
        # Use secrets management
        ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic-key
        GOOGLE_AI_API_KEY_FILE=/run/secrets/google-key
        RUST_LOG=info
        CLEWDR_HOST=0.0.0.0
        CLEWDR_PORT=8484
        CLEWDR_LOG_FORMAT=json
        ```
        
        ### Security Hardening
        
        ```toml
        [security]
        require_auth = true
        allowed_origins = ["https://yourdomain.com"]
        rate_limit = 60
        burst_limit = 10
        max_request_size = 1048576  # 1MB
        
        [tls]
        cert_file = "/etc/ssl/certs/clewdr.crt"
        key_file = "/etc/ssl/private/clewdr.key"
        min_version = "1.3"
        ```
        EOF
        
    - name: Build documentation with mdbook
      run: |
        echo "📖 Building documentation with mdbook..."
        
        cd docs
        
        # Install mdbook if not available in Nix shell
        nix develop .#full --command bash -c "
          mdbook build
        "
        
        echo "✅ Documentation built successfully"
        ls -la book/
        
    - name: Optimize documentation assets
      run: |
        echo "⚡ Optimizing documentation assets..."
        
        cd docs/book
        
        # Create custom CSS for better styling
        mkdir -p theme
        cat > theme/custom.css << 'EOF'
        /* Custom ClewdR documentation styling */
        
        :root {
          --sidebar-width: 260px;
          --content-max-width: 900px;
          --nav-height: 50px;
        }
        
        .sidebar {
          width: var(--sidebar-width);
        }
        
        .content {
          max-width: var(--content-max-width);
          margin: 0 auto;
        }
        
        /* Syntax highlighting improvements */
        pre {
          border-radius: 6px;
          border: 1px solid #e1e5e9;
        }
        
        /* Code block language indicators */
        pre[class*="language-"]::before {
          content: attr(class);
          position: absolute;
          top: 0;
          right: 0;
          padding: 2px 8px;
          font-size: 12px;
          background: #f6f8fa;
          border-bottom-left-radius: 4px;
        }
        
        /* Improve table styling */
        table {
          border-collapse: collapse;
          margin: 20px 0;
          width: 100%;
        }
        
        th, td {
          border: 1px solid #dfe2e5;
          padding: 12px;
          text-align: left;
        }
        
        th {
          background-color: #f6f8fa;
          font-weight: 600;
        }
        
        /* API endpoint styling */
        .api-endpoint {
          background: #f8f9fa;
          border-left: 4px solid #28a745;
          padding: 16px;
          margin: 16px 0;
          border-radius: 4px;
        }
        
        /* Warning/info boxes */
        .warning {
          background: #fff3cd;
          border-left: 4px solid #ffc107;
          padding: 16px;
          margin: 16px 0;
        }
        
        .info {
          background: #d1ecf1;
          border-left: 4px solid #17a2b8;
          padding: 16px;
          margin: 16px 0;
        }
        EOF
        
        # Add favicon
        echo "🎨 Adding favicon and branding..."
        
        # Create a simple SVG favicon (placeholder)
        cat > favicon.svg << 'EOF'
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="#2563eb"/>
          <text x="50" y="55" font-family="Arial" font-size="32" font-weight="bold" text-anchor="middle" fill="white">C</text>
        </svg>
        EOF
        
        # Convert SVG to PNG for favicon (if imagemagick available)
        if command -v convert >/dev/null 2>&1; then
          convert favicon.svg -resize 32x32 favicon.ico
        fi
        
        echo "✅ Documentation assets optimized"
        
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: docs/book/
        retention-days: 30
        
    - name: Generate documentation summary
      run: |
        echo "📊 Documentation Build Summary"
        echo "=============================="
        echo "Total pages: $(find docs/book -name "*.html" | wc -l)"
        echo "Documentation size: $(du -sh docs/book | cut -f1)"
        echo "Build time: $(date)"
        echo "=============================="
        
        # Create build info file
        cat > docs/book/build-info.json << EOF
        {
          "build_time": "$(date -Iseconds)",
          "commit": "${{ github.sha }}",
          "branch": "${{ github.ref_name }}",
          "repository": "${{ github.repository }}",
          "pages": $(find docs/book -name "*.html" | wc -l),
          "size": "$(du -sb docs/book | cut -f1)"
        }
        EOF
        
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Download documentation artifacts
      uses: actions/download-artifact@v4
      with:
        name: documentation-site
        path: ./docs-site
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./docs-site
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Create deployment summary
      run: |
        echo "🚀 Documentation Deployment Summary"
        echo "=================================="
        echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
        echo "Deployment time: $(date)"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "=================================="
        
  validate-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest
    needs: deploy-docs
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Install link checker
      run: |
        npm install -g linkinator
        
    - name: Check documentation links
      run: |
        echo "🔗 Checking documentation links..."
        
        # Wait for deployment to be available
        sleep 30
        
        # Check internal and external links
        linkinator "${{ env.DOCS_SITE_URL }}" \
          --recurse \
          --markdown \
          --timeout 10000 \
          --skip "localhost|127.0.0.1|example.com" \
          --format json > link-check-results.json
          
        # Report results
        if [ $? -eq 0 ]; then
          echo "✅ All documentation links are valid"
        else
          echo "❌ Some documentation links are broken"
          cat link-check-results.json
          exit 1
        fi
        
    - name: Upload link check results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: link-check-results
        path: link-check-results.json
        retention-days: 7
        
  summary:
    name: Documentation Workflow Summary
    runs-on: ubuntu-latest
    needs: [build-docs, deploy-docs, validate-links]
    if: always()
    
    steps:
    - name: Report workflow results
      run: |
        echo "📚 Documentation Workflow Summary"
        echo "================================="
        echo "Build: ${{ needs.build-docs.result }}"
        echo "Deploy: ${{ needs.deploy-docs.result }}"
        echo "Link Validation: ${{ needs.validate-links.result }}"
        echo "================================="
        
        if [[ "${{ needs.build-docs.result }}" == "success" ]]; then
          echo "✅ Documentation built successfully"
        else
          echo "❌ Documentation build failed"
        fi
        
        if [[ "${{ needs.deploy-docs.result }}" == "success" ]]; then
          echo "✅ Documentation deployed successfully"
          echo "🌐 Site available at: ${{ env.DOCS_SITE_URL }}"
        else
          echo "❌ Documentation deployment failed"
        fi
        
        if [[ "${{ needs.validate-links.result }}" == "success" ]]; then
          echo "✅ All documentation links are valid"
        else
          echo "⚠️ Some documentation links may be broken"
        fi