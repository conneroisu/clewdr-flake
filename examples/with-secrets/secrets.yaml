# SOPS encrypted secrets file
# This is a template - in production, encrypt with: sops secrets.yaml

# ClewdR API passwords
clewdr:
  api-password: ENC[AES256_GCM,data:example-encrypted-api-password,type:str]
  admin-password: ENC[AES256_GCM,data:example-encrypted-admin-password,type:str]

# API credentials
anthropic:
  api-key: ENC[AES256_GCM,data:sk-example-encrypted-anthropic-key,type:str]

google:
  ai-api-key: ENC[AES256_GCM,data:example-encrypted-google-ai-key,type:str]
  service-account: ENC[AES256_GCM,data:example-encrypted-service-account-json,type:str]

# Database connection
database:
  url: ENC[AES256_GCM,data:postgresql://encrypted-connection-string,type:str]

# SSL certificates (base64 encoded)
ssl:
  cert: ENC[AES256_GCM,data:LS0tLS1CRUdJTi...,type:str]
  key: ENC[AES256_GCM,data:LS0tLS1CRUdJTi...,type:str]