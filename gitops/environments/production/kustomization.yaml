apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference to base configuration
resources:
  - ../../

# Production-specific namespace
namespace: clewdr-production

# Production-specific labels
commonLabels:
  environment: production
  deployment.environment: production

# Production-specific annotations
commonAnnotations:
  deployment.kubernetes.io/environment: production

# Production image configuration
images:
  - name: clewdr
    newTag: v0.10.9

# Production-specific ConfigMap
configMapGenerator:
  - name: clewdr-config
    behavior: merge
    literals:
      - RUST_LOG=info
      - ENVIRONMENT=production

# Production-specific patches
patches:
  - target:
      kind: Deployment
      name: clewdr
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "200m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"

  - target:
      kind: Ingress
      name: clewdr-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: clewdr.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: clewdr.example.com

  - target:
      kind: HorizontalPodAutoscaler
      name: clewdr-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
      - op: replace
        path: /spec/metrics/0/resource/target/averageUtilization
        value: 60
      - op: replace
        path: /spec/metrics/1/resource/target/averageUtilization
        value: 70

# Production-specific resources
resources:
  - networkpolicy.yaml
  - servicemonitor.yaml