apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clewdr-network-policy
  namespace: clewdr-production
spec:
  podSelector:
    matchLabels:
      app: clewdr
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8484
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443  # HTTPS for external APIs
    - protocol: TCP
      port: 80   # HTTP
    - protocol: TCP
      port: 53   # DNS
    - protocol: UDP
      port: 53   # DNS
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clewdr-deny-all
  namespace: clewdr-production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress